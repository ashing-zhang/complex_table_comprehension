# 小规模调试场景配置 (前 N 题 + 独立输出文件, 不污染正式 submission).
# 启动方式: CONFIG=configs/smoke.yaml python -m src.main
# 也可由环境变量覆盖: LIMIT=20 OUTPUT=data/output/x.xlsx CONFIG=configs/smoke.yaml python -m src.main

project:
  name: table-agent

run:
  mode: run
  limit: 15
  submission: ""

data:
  tests: data/tests.xlsx
  files: data/files
  output: data/output/submission_smoke.xlsx
  journal: data/output/results_smoke.jsonl
  debug: data/debug

model:
  provider: aliyun
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  vision_model: qwen-vl-max-latest
  reasoning_model: qwen-plus
  temperature: 0
  max_tokens: 4096
  request_timeout: 120

pipeline:
  max_retries: 2
  enable_verifier: false
  enable_cache: true
  repair_max_retries: 2
  save_intermediate: true
  save_images: true
  page_top_k: 5
  table_top_k: 3
  pdf_dpi: 200
  max_image_long_side: 4096

concurrency:
  max_workers: 4
  qwen_concurrency: 2

debug:
  save_intermediate: true
  save_images: true
