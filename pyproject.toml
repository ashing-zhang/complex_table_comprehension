[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "table-agent"
version = "0.1.0"
description = "复杂表格视觉理解与问答系统 (Complex Table Visual Understanding & QA)"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pillow>=10.0",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "openai>=1.40",
    "pymupdf>=1.24",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    # 从项目根 .env 加载环境变量 (开发本地), 生产环境由真实环境变量优先 (override=False)
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
